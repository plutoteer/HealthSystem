#端口
server:
  port: 8080
#数据库
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_health?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"  # 使用引号包裹密码，确保被解析为字符串
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

  redis:
    port: 6379
    host: localhost

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

#debug报告
logging:
  level:
    com.muzi: debug

# Dify（使用Ollama模型）配置
ai:
  dify:
    enabled: true
    base-url: "http://localhost/v1"
    api-key: "app-zsYOmQPsT4rbiRqG9ksV4Asb"
    timeout-ms: 15000

#逻辑删除
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  type-aliases-package: com.muzi.*.entity



